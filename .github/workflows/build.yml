name: Build production image

# Spouští se při pushnutí tagu verze (v1.2.3) a lze spustit i ručně
# z záložky Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Odeslat image do Docker Hubu'
        type: boolean
        default: true
env:
  IMAGE: ghcr.io/michalvarys/uat-admin

permissions:
  contents: read
  packages: write        # bez toho nelze do ghcr zapsat

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Tag v1.2.3 dá image 1.2.3 a zároveň latest.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Přihlásit se do GHCR
        if: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN vytváří GitHub pro každý běh sám —
          # žádné secrets se nenastavují.
          password: ${{ secrets.GITHUB_TOKEN }}


      # Strapi si konfiguraci (databáze, klíče, port) bere z proměnných
      # prostředí až za běhu, takže build nepotřebuje žádné build-args —
      # na rozdíl od frontendu, kde se NEXT_PUBLIC_* zapékají do bundlu.
      - name: Build a push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Shrnutí
        run: |
          {
            echo "### Build hotový"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.meta.outputs.tags }}\` |"
            echo ""
            echo "Nasazení na serveru:"
            echo '```bash'
            echo "docker compose pull strapi"
            echo "docker compose up -d --force-recreate strapi"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
